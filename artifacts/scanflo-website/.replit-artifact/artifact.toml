kind = "web"
previewPath = "/"
title = "Scanflo Valves"
version = "1.0.0"
id = "artifacts/scanflo-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20285

[services.development]
run = "pnpm --filter @workspace/scanflo-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scanflo-website", "run", "build" ]
publicDir = "artifacts/scanflo-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20285"
BASE_PATH = "/"
