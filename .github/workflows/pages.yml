name: Deploy Scanflo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate website
        id: site
        shell: bash
        run: |
          if [ -f src/App.tsx ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "dir=artifacts/scanflo-website" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/configure-pages@v5
      - name: Install frontend packages only
        working-directory: ${{ steps.site.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Check, test and build
        working-directory: ${{ steps.site.outputs.dir }}
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run verify:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.dir }}/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
